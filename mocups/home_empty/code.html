<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100%;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "inverse-on-surface": "#eaf1ff", "primary-container": "#4f46e5", "on-secondary": "#ffffff", "surface-container-lowest": "#ffffff", "on-secondary-container": "#00714d", "surface-variant": "#d3e4fe", "on-surface-variant": "#464555", "on-primary": "#ffffff", "error": "#ba1a1a", "tertiary": "#7b3300", "on-primary-container": "#dad7ff", "primary-fixed": "#e2dfff", "surface-container-high": "#dce9ff", "on-primary-fixed-variant": "#3323cc", "surface-tint": "#4d44e3", "on-tertiary-fixed-variant": "#783200", "background": "#f8f9ff", "outline": "#777587", "inverse-surface": "#213145", "surface-container-low": "#eff4ff", "surface-dim": "#cbdbf5", "error-container": "#ffdad6", "primary-fixed-dim": "#c3c0ff", "tertiary-fixed-dim": "#ffb690", "secondary-fixed-dim": "#4edea3", "surface-bright": "#f8f9ff", "secondary-container": "#6cf8bb", "on-error": "#ffffff", "primary": "#3525cd", "on-tertiary": "#ffffff", "tertiary-container": "#a04500", "outline-variant": "#c7c4d8", "surface-container": "#e5eeff", "secondary-fixed": "#6ffbbe", "on-secondary-fixed-variant": "#005236", "secondary": "#006c49", "on-tertiary-container": "#ffd2bd", "on-secondary-fixed": "#002113", "on-primary-fixed": "#0f0069", "inverse-primary": "#c3c0ff", "on-error-container": "#93000a", "on-surface": "#0b1c30", "on-background": "#0b1c30", "tertiary-fixed": "#ffdbca", "surface-container-highest": "#d3e4fe", "on-tertiary-fixed": "#341100", "surface": "#f8f9ff" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-xl": "1.5rem", "space-lg": "1rem", "gutter": "0.75rem", "space-md": "0.75rem", "space-xs": "0.25rem", "margin": "1rem", "space-sm": "0.5rem" }, fontFamily: { "headline-xl": ["Inter"], "headline-lg": ["Inter"], "headline-md": ["Inter"], "label-sm": ["Inter"], "body-lg": ["Inter"], "label-md": ["Inter"], "headline-sm": ["Inter"], "body-sm": ["Inter"], "body-md": ["Inter"] }, fontSize: { "headline-xl": ["28px", { lineHeight: "34px", letterSpacing: "-0.02em", fontWeight: "700" }], "headline-lg": ["22px", { lineHeight: "28px", letterSpacing: "-0.015em", fontWeight: "600" }], "headline-md": ["18px", { lineHeight: "24px", letterSpacing: "-0.01em", fontWeight: "600" }], "label-sm": ["11px", { lineHeight: "14px", letterSpacing: "0.03em", fontWeight: "600" }], "body-lg": ["15px", { lineHeight: "22px", letterSpacing: "0em", fontWeight: "400" }], "label-md": ["13px", { lineHeight: "18px", letterSpacing: "0.01em", fontWeight: "500" }], "headline-sm": ["16px", { lineHeight: "22px", letterSpacing: "0em", fontWeight: "600" }], "body-sm": ["12px", { lineHeight: "16px", letterSpacing: "0.01em", fontWeight: "400" }], "body-md": ["14px", { lineHeight: "20px", letterSpacing: "0em", fontWeight: "400" }] } } } }</script></head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 pt-safe bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><button aria-label="Menu" class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container-low transition-colors"><span class="material-symbols-outlined text-[24px]">menu</span></button><span class="font-headline-md text-headline-md text-on-surface tracking-tight font-semibold">docLoom</span></div><div class="flex items-center gap-space-xs"><button aria-label="Upgrade to Premium" class="h-9 px-space-sm rounded-full bg-surface-container-high/60 flex items-center gap-1 text-tertiary-container hover:bg-surface-container-high transition-colors"><span class="material-symbols-outlined text-[18px] text-tertiary-container">workspace_premium</span><span class="font-label-sm text-label-sm uppercase tracking-wider font-semibold text-tertiary-container">PRO</span></button><button aria-label="Search" class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-low transition-colors"><span class="material-symbols-outlined text-[22px]">search</span></button><button aria-label="More options" class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-low transition-colors"><span class="material-symbols-outlined text-[22px]">more_vert</span></button><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center ml-space-xs shrink-0"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 pb-[100px] px-margin bg-surface"><div class="flex flex-col w-full min-h-[calc(100vh-170px)] justify-center items-center select-none py-space-xl">
<!-- Interactive Ambient Empty State Showcase -->
<div class="relative w-full max-w-[340px] flex flex-col items-center justify-center">
<!-- Subtle Ambient Glow Rings -->
<div class="absolute -top-8 w-64 h-64 bg-primary-fixed/40 rounded-full blur-3xl pointer-events-none -z-10"></div>
<div class="absolute top-12 w-48 h-48 bg-secondary-container/30 rounded-full blur-2xl pointer-events-none -z-10"></div>
<!-- Friendly Minimalist Vector Illustration -->
<div class="relative w-44 h-44 flex items-center justify-center">
<!-- Angled Back Document 2 -->
<div class="absolute w-24 h-32 bg-surface-container-high rounded-xl -rotate-12 translate-x-4 -translate-y-2 shadow-sm transition-transform duration-500 hover:-rotate-16 flex flex-col p-2.5 gap-1.5 opacity-80">
<div class="w-8 h-1.5 bg-outline-variant/60 rounded-full"></div>
<div class="w-14 h-1 bg-outline-variant/40 rounded-full"></div>
<div class="w-10 h-1 bg-outline-variant/40 rounded-full"></div>
</div>
<!-- Angled Back Document 1 (Mint/Teal Accent) -->
<div class="absolute w-26 h-34 bg-surface-container rounded-xl rotate-6 -translate-x-3 -translate-y-1 shadow-sm transition-transform duration-500 hover:rotate-8 flex flex-col p-3 gap-2">
<div class="w-10 h-1.5 bg-secondary/30 rounded-full"></div>
<div class="w-16 h-1 bg-outline-variant/50 rounded-full"></div>
<div class="w-12 h-1 bg-outline-variant/40 rounded-full"></div>
</div>
<!-- Hero Crisp Scanning Document -->
<div class="relative w-28 h-36 bg-surface-container-lowest rounded-xl shadow-[0_8px_24px_-4px_rgba(15,23,42,0.08)] flex flex-col justify-between p-3.5 z-10 transition-transform active:scale-95 duration-300">
<!-- Document Content Placeholder -->
<div class="flex flex-col gap-2">
<div class="flex items-center justify-between">
<div class="w-6 h-6 rounded-lg bg-primary-fixed flex items-center justify-center">
<span class="material-symbols-outlined text-[14px] text-primary">description</span>
</div>
<span class="material-symbols-outlined text-[16px] text-secondary">verified</span>
</div>
<div class="w-14 h-2 bg-on-surface/10 rounded-full mt-1"></div>
<div class="w-full h-1 bg-on-surface/5 rounded-full"></div>
<div class="w-16 h-1 bg-on-surface/5 rounded-full"></div>
</div>
<!-- Animated Scanner Beam -->
<div class="relative w-full h-1 bg-primary-container/20 rounded-full overflow-hidden my-auto">
<div class="absolute inset-y-0 w-8 bg-gradient-to-r from-transparent via-primary-container to-transparent animate-pulse rounded-full"></div>
</div>
<!-- Receipt / Signature Micro Line -->
<div class="pt-2 flex items-center justify-between border-none">
<div class="w-8 h-1 bg-on-surface/10 rounded-full"></div>
<div class="w-4 h-4 rounded-full bg-secondary-container/60 flex items-center justify-center">
<span class="material-symbols-outlined text-[10px] text-on-secondary-container">done</span>
</div>
</div>
</div>
<!-- Playful Floating Delight Badges -->
<div class="absolute -top-1 -right-1 w-9 h-9 rounded-full bg-surface-container-lowest shadow-md flex items-center justify-center z-20 animate-bounce" style="animation-duration: 2.4s;">
<span class="material-symbols-outlined text-[18px] text-primary">auto_awesome</span>
</div>
<div class="absolute -bottom-2 -left-2 w-8 h-8 rounded-full bg-surface-container-lowest shadow-md flex items-center justify-center z-20">
<span class="material-symbols-outlined text-[16px] text-secondary">qr_code_scanner</span>
</div>
</div>
<!-- Typography Content -->
<h1 class="font-headline-lg text-headline-lg text-on-surface mt-space-lg mb-space-xs text-center font-bold tracking-tight">
      Scan your first document
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center max-w-[270px] leading-relaxed mb-space-xl">
      Digitize receipts, ID cards, notes, or import existing files effortlessly.
    </p>
<!-- Onboarding Guidance Chips -->
<div class="w-full flex flex-col gap-space-sm items-center">
<!-- Suggestion 1: Quick Camera Scan -->
<button class="w-full max-w-[280px] p-space-sm pl-space-md rounded-full bg-surface-container-lowest shadow-[0_2px_8px_-2px_rgba(15,23,42,0.05)] hover:bg-surface-container-low active:scale-[0.98] transition-all flex items-center justify-between group" onclick="handleHintClick('scan')">
<div class="flex items-center gap-space-sm min-w-0">
<div class="w-7 h-7 rounded-full bg-primary-fixed flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined text-[16px]">photo_camera</span>
</div>
<span class="font-label-md text-label-md text-on-surface font-medium truncate">Tap camera to scan</span>
</div>
<span class="material-symbols-outlined text-[18px] text-outline-variant pr-space-xs group-hover:translate-x-0.5 transition-transform">arrow_forward</span>
</button>
<!-- Suggestion 2: Import from Gallery/Files -->
<button class="w-full max-w-[280px] p-space-sm pl-space-md rounded-full bg-surface-container-lowest shadow-[0_2px_8px_-2px_rgba(15,23,42,0.05)] hover:bg-surface-container-low active:scale-[0.98] transition-all flex items-center justify-between group" onclick="handleHintClick('import')">
<div class="flex items-center gap-space-sm min-w-0">
<div class="w-7 h-7 rounded-full bg-secondary-container/60 flex items-center justify-center text-secondary group-hover:bg-secondary group-hover:text-on-secondary transition-colors">
<span class="material-symbols-outlined text-[16px]">add_photo_alternate</span>
</div>
<span class="font-label-md text-label-md text-on-surface font-medium truncate">Tap + to import files</span>
</div>
<span class="material-symbols-outlined text-[18px] text-outline-variant pr-space-xs group-hover:translate-x-0.5 transition-transform">arrow_forward</span>
</button>
</div>
<!-- Discreet Encouraging Footnote / Secure Tag -->
<div class="mt-space-xl flex items-center gap-space-xs text-on-surface-variant/70">
<span class="material-symbols-outlined text-[14px]">lock</span>
<span class="font-label-sm text-label-sm tracking-wide uppercase">On-device edge processing</span>
</div>
</div>
<!-- Interactive Ripple / Pulse Toast -->
<div class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface font-body-sm text-body-sm px-space-md py-space-xs rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-40 flex items-center gap-1.5" id="actionToast">
<span class="material-symbols-outlined text-[16px] text-secondary-fixed">touch_app</span>
<span id="toastMessage">Ready to scan</span>
</div>
</div>
<script>
  function handleHintClick(actionType) {
    const toast = document.getElementById('actionToast');
    const msg = document.getElementById('toastMessage');
    
    if (actionType === 'scan') {
      msg.textContent = 'Camera scanner ready — tap button below';
    } else {
      msg.textContent = 'Gallery picker ready — tap + button below';
    }
    
    toast.classList.remove('opacity-0');
    toast.classList.add('opacity-100');
    
    // Highlight effect on bottom FAB
    const fab = document.querySelector('aside .bg-primary-container');
    if (fab) {
      fab.classList.add('scale-105', 'ring-4', 'ring-primary-fixed');
      setTimeout(() => {
        fab.classList.remove('scale-105', 'ring-4', 'ring-primary-fixed');
      }, 400);
    }

    setTimeout(() => {
      toast.classList.remove('opacity-100');
      toast.classList.add('opacity-0');
    }, 2200);
  }
</script></main><aside class="fixed bottom-6 right-margin z-50"><div class="h-14 px-space-md rounded-full bg-primary-container text-on-primary flex items-center gap-space-sm shadow-[0_12px_28px_-4px_rgba(79,70,229,0.35),0_4px_10px_-2px_rgba(79,70,229,0.20)] active:scale-95 transition-transform select-none"><button aria-label="Quick Scan" class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-white/10 text-on-primary transition-colors"><span class="material-symbols-outlined text-[22px]">photo_camera</span></button><div class="w-[1px] h-6 bg-white/25"></div><button aria-label="Import or Add" class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-white/10 text-on-primary transition-colors"><span class="material-symbols-outlined text-[22px]">add</span></button></div></aside></body></html>
