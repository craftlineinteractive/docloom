<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, height=844, initial-scale=1.0">
<title>docLoom - Frame 8: Signature Mode</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
</style>
</head>
<body class="w-[390px] h-[844px] bg-[#0c0e14] text-white flex flex-col justify-between overflow-hidden relative select-none mx-auto">
  <!-- Top Bar -->
  <div class="relative z-10 pt-11 px-5 pb-3 flex items-center justify-between">
    <button class="w-10 h-10 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center text-white/90">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
    <div class="flex items-center space-x-3">
      <button class="w-10 h-10 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center text-white/90">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
      </button>
      <button class="w-10 h-10 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center text-white/90">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      </button>
    </div>
  </div>

  <!-- Mode Selector Row -->
  <div class="relative z-10 px-4 py-2 flex items-center justify-between text-xs font-medium tracking-wide border-b border-white/10">
    <span class="text-white/40">Document</span>
    <span class="text-white/40">ID Card</span>
    <span class="text-white/40">Book</span>
    <span class="text-white/40">Photo</span>
    <span class="text-[#4F46E5] font-semibold bg-indigo-500/20 px-2.5 py-1 rounded-full border border-indigo-500/30">Signature</span>
    <span class="text-white/40">QR Scanner</span>
    <span class="text-white/40">OCR Text</span>
  </div>

  <!-- VIEWFINDER: SIGNATURE ON WHITE PAPER -->
  <div class="flex-1 flex flex-col items-center justify-center px-6 relative my-auto">
    <!-- Camera Target Reticle/Paper Box -->
    <div class="relative w-[320px] h-[210px] bg-[#FAFBFD] rounded-2xl shadow-2xl p-6 flex flex-col justify-between border-2 border-dashed border-[#4F46E5]/40 overflow-hidden">
      <!-- Corner Guides -->
      <div class="absolute top-2 left-2 w-4 h-4 border-t-2 border-l-2 border-[#4F46E5]"></div>
      <div class="absolute top-2 right-2 w-4 h-4 border-t-2 border-r-2 border-[#4F46E5]"></div>
      <div class="absolute bottom-2 left-2 w-4 h-4 border-b-2 border-l-2 border-[#4F46E5]"></div>
      <div class="absolute bottom-2 right-2 w-4 h-4 border-b-2 border-r-2 border-[#4F46E5]"></div>

      <div class="flex justify-between items-center text-[#8A90A6] text-[10px] font-semibold tracking-wider uppercase">
        <span>Signature Paper</span>
        <span class="text-[#4F46E5] bg-indigo-50 px-2 py-0.5 rounded-full font-bold">Auto Crop</span>
      </div>

      <!-- Real SVG Handwritten Signature -->
      <div class="my-auto flex items-center justify-center">
        <svg class="w-60 h-24 text-[#1E2340]" viewBox="0 0 240 90" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20,60 C35,25 45,15 55,45 C65,75 80,40 100,25 C115,15 130,55 140,50 C155,42 165,30 180,35 C195,40 170,75 210,65" />
          <path d="M50,70 L190,68" stroke-dasharray="4 4" stroke-width="1.2" stroke="#8A90A6" />
        </svg>
      </div>

      <p class="text-center text-[10px] text-[#8A90A6]">Place signature inside box</p>
    </div>

    <!-- Alignment Hint -->
    <div class="mt-4 px-3 py-1 bg-black/50 backdrop-blur-md rounded-full text-[11px] text-white/80">
      Optimal lighting detected • High contrast
    </div>
  </div>

  <!-- Bottom Controls Area -->
  <div class="relative z-10 pb-8 pt-4 px-6 flex items-center justify-between">
    <button class="w-11 h-11 rounded-full bg-white/10 flex items-center justify-center text-white">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
    </button>
    <!-- Shutter Button -->
    <div class="w-18 h-18 p-1.5 rounded-full border-2 border-white/60 flex items-center justify-center">
      <div class="w-14 h-14 rounded-full bg-white active:scale-95 transition-transform flex items-center justify-center">
        <div class="w-12 h-12 rounded-full border border-gray-300"></div>
      </div>
    </div>
    <!-- Gallery Import -->
    <button class="w-11 h-11 rounded-full bg-white/10 flex items-center justify-center text-white">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
    </button>
  </div>
</body>
</html>
