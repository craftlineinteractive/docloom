<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, height=844, initial-scale=1.0">
<title>docLoom - Frame 5: Photo Mode (ID Photo Editor)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
</style>
</head>
<body class="w-[390px] h-[844px] bg-[#0c0e14] text-white flex flex-col justify-between overflow-hidden relative select-none mx-auto">
  <!-- CAMERA VIEWPORT BACKGROUND -->
  <div class="absolute inset-0 bg-[#12151f] flex flex-col justify-between z-0">
    <!-- Camera Viewfinder Sim -->
    <div class="absolute inset-0 bg-cover bg-center opacity-40" style="background-image: radial-gradient(circle at 50% 40%, #2a314b 0%, #0e111a 90%);"></div>

    <!-- Top Bar -->
    <div class="relative z-10 pt-11 px-5 pb-3 flex items-center justify-between">
      <button class="w-10 h-10 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center text-white/90">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
      <div class="flex items-center space-x-3">
        <button class="w-10 h-10 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center text-white/90">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        </button>
        <button class="w-10 h-10 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center text-white/90">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        </button>
      </div>
    </div>

    <!-- Mode Selector Row -->
    <div class="relative z-10 px-4 py-2 flex items-center justify-between text-xs font-medium tracking-wide overflow-x-hidden border-b border-white/10">
      <span class="text-white/40">Document</span>
      <span class="text-white/40">ID Card</span>
      <span class="text-white/40">Book</span>
      <span class="text-[#4F46E5] font-semibold bg-indigo-500/20 px-2.5 py-1 rounded-full border border-indigo-500/30">Photo</span>
      <span class="text-white/40">Signature</span>
      <span class="text-white/40">QR Scanner</span>
      <span class="text-white/40">OCR Text</span>
    </div>

    <!-- Bottom Controls Area -->
    <div class="mt-auto pb-8 pt-4 px-6 flex items-center justify-between">
      <button class="w-11 h-11 rounded-full bg-white/10 flex items-center justify-center text-white">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      </button>
      <!-- Center Shutter -->
      <div class="w-18 h-18 p-1.5 rounded-full border-2 border-white/60 flex items-center justify-center">
        <div class="w-14 h-14 rounded-full bg-white active:scale-95 transition-transform"></div>
      </div>
      <!-- Right Gallery Import -->
      <button class="w-11 h-11 rounded-full bg-white/10 flex items-center justify-center text-white">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
      </button>
    </div>
  </div>

  <!-- 50% DARK OVERLAY -->
  <div class="absolute inset-0 bg-black/60 z-20 backdrop-blur-[2px]"></div>

  <!-- CENTERED WHITE DIALOG (20px rounded) -->
  <div class="relative z-30 m-auto w-[350px] bg-white text-[#1E2340] rounded-[20px] p-5 shadow-2xl flex flex-col">
    <!-- Header -->
    <div class="mb-3">
      <h2 class="text-[18px] font-bold text-[#1E2340] tracking-tight">ID Photo Editor</h2>
      <p class="text-[13px] font-semibold text-[#4B5563] mt-0.5">Select photo size</p>
      <p class="text-[11px] text-[#8A90A6] mt-0.5">Long press and drag to rearrange</p>
    </div>

    <!-- 2-Column Grid (6 Cards) -->
    <div class="grid grid-cols-2 gap-2.5 my-2">
      <!-- 1: 2 x 2 INCHES (Selected) -->
      <div class="relative bg-[#EEF0FF] border-2 border-[#4F46E5] rounded-[12px] p-2.5 flex flex-col justify-between h-[70px]">
        <span class="absolute top-1.5 right-1.5 text-[#4F46E5]/60 hover:text-[#4F46E5]">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </span>
        <div class="pr-3">
          <p class="text-[11px] font-bold text-[#1E2340] leading-tight">2 x 2 INCHES</p>
          <p class="text-[9px] font-semibold text-[#4F46E5] mt-0.5">DPI 600</p>
        </div>
        <div class="flex justify-end">
          <svg class="w-4 h-4 text-[#4F46E5]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        </div>
      </div>

      <!-- 2: 35 x 45 MILLIMETERS -->
      <div class="relative bg-white border border-[#E5E7EB] rounded-[12px] p-2.5 flex flex-col justify-between h-[70px]">
        <span class="absolute top-1.5 right-1.5 text-[#9CA3AF]">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </span>
        <div class="pr-3">
          <p class="text-[11px] font-semibold text-[#1E2340] leading-tight">35 x 45 MM</p>
          <p class="text-[9px] text-[#8A90A6] mt-0.5">DPI 300</p>
        </div>
        <div class="flex justify-end">
          <svg class="w-4 h-4 text-[#8A90A6]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        </div>
      </div>

      <!-- 3: 2 x 2.5 CENTIMETERS -->
      <div class="relative bg-white border border-[#E5E7EB] rounded-[12px] p-2.5 flex flex-col justify-between h-[70px]">
        <span class="absolute top-1.5 right-1.5 text-[#9CA3AF]">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </span>
        <div class="pr-3">
          <p class="text-[11px] font-semibold text-[#1E2340] leading-tight">2 x 2.5 CM</p>
          <p class="text-[9px] text-[#8A90A6] mt-0.5">DPI 450</p>
        </div>
        <div class="flex justify-end">
          <svg class="w-4 h-4 text-[#8A90A6]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        </div>
      </div>

      <!-- 4: 600 x 600 PIXEL -->
      <div class="relative bg-white border border-[#E5E7EB] rounded-[12px] p-2.5 flex flex-col justify-between h-[70px]">
        <span class="absolute top-1.5 right-1.5 text-[#9CA3AF]">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </span>
        <div class="pr-3">
          <p class="text-[11px] font-semibold text-[#1E2340] leading-tight">600 x 600 PX</p>
          <p class="text-[9px] text-[#8A90A6] mt-0.5">PIXEL</p>
        </div>
        <div class="flex justify-end">
          <svg class="w-4 h-4 text-[#8A90A6]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        </div>
      </div>

      <!-- 5: 51 x 51 MILLIMETERS -->
      <div class="relative bg-white border border-[#E5E7EB] rounded-[12px] p-2.5 flex flex-col justify-between h-[70px]">
        <span class="absolute top-1.5 right-1.5 text-[#9CA3AF]">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </span>
        <div class="pr-3">
          <p class="text-[11px] font-semibold text-[#1E2340] leading-tight">51 x 51 MM</p>
          <p class="text-[9px] text-[#8A90A6] mt-0.5">DPI 300</p>
        </div>
        <div class="flex justify-end">
          <svg class="w-4 h-4 text-[#8A90A6]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        </div>
      </div>

      <!-- 6: 25 x 35 MILLIMETERS -->
      <div class="relative bg-white border border-[#E5E7EB] rounded-[12px] p-2.5 flex flex-col justify-between h-[70px]">
        <span class="absolute top-1.5 right-1.5 text-[#9CA3AF]">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </span>
        <div class="pr-3">
          <p class="text-[11px] font-semibold text-[#1E2340] leading-tight">25 x 35 MM</p>
          <p class="text-[9px] text-[#8A90A6] mt-0.5">DPI 450</p>
        </div>
        <div class="flex justify-end">
          <svg class="w-4 h-4 text-[#8A90A6]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        </div>
      </div>
    </div>

    <!-- Footer Buttons: Close (outline), Add New (indigo outline), Select (filled indigo) -->
    <div class="flex items-center justify-end space-x-2 pt-3 mt-1 border-t border-gray-100">
      <button class="px-3 py-2 text-xs font-semibold text-[#8A90A6] border border-gray-200 rounded-lg hover:bg-gray-50">Close</button>
      <button class="px-3 py-2 text-xs font-semibold text-[#4F46E5] border border-[#4F46E5] rounded-lg hover:bg-indigo-50">Add New</button>
      <button class="px-4 py-2 text-xs font-semibold text-white bg-[#4F46E5] rounded-lg shadow-sm hover:bg-indigo-600">Select</button>
    </div>
  </div>
</body>
</html>
