<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, height=844, initial-scale=1.0">
<title>docLoom - Frame 7: Book Mode Dialog</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
</style>
</head>
<body class="w-[390px] h-[844px] bg-[#0c0e14] text-white flex flex-col justify-between overflow-hidden relative select-none mx-auto">
  <!-- CAMERA VIEWPORT BACKGROUND -->
  <div class="absolute inset-0 bg-[#12151f] flex flex-col justify-between z-0">
    <div class="absolute inset-0 bg-cover bg-center opacity-40" style="background-image: radial-gradient(circle at 50% 40%, #2a314b 0%, #0e111a 90%);"></div>

    <!-- Top Bar -->
    <div class="relative z-10 pt-11 px-5 pb-3 flex items-center justify-between">
      <button class="w-10 h-10 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center text-white/90">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
      <div class="flex items-center space-x-3">
        <button class="w-10 h-10 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center text-white/90">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        </button>
        <button class="w-10 h-10 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center text-white/90">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        </button>
      </div>
    </div>

    <!-- Mode Selector Row -->
    <div class="relative z-10 px-4 py-2 flex items-center justify-between text-xs font-medium tracking-wide border-b border-white/10">
      <span class="text-white/40">Document</span>
      <span class="text-white/40">ID Card</span>
      <span class="text-[#4F46E5] font-semibold bg-indigo-500/20 px-2.5 py-1 rounded-full border border-indigo-500/30">Book</span>
      <span class="text-white/40">Photo</span>
      <span class="text-white/40">Signature</span>
      <span class="text-white/40">QR Scanner</span>
      <span class="text-white/40">OCR Text</span>
    </div>

    <!-- Bottom Controls Area -->
    <div class="mt-auto pb-8 pt-4 px-6 flex items-center justify-between">
      <button class="w-11 h-11 rounded-full bg-white/10 flex items-center justify-center text-white">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      </button>
      <div class="w-18 h-18 p-1.5 rounded-full border-2 border-white/60 flex items-center justify-center">
        <div class="w-14 h-14 rounded-full bg-white"></div>
      </div>
      <button class="w-11 h-11 rounded-full bg-white/10 flex items-center justify-center text-white">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
      </button>
    </div>
  </div>

  <!-- 50% DARK OVERLAY -->
  <div class="absolute inset-0 bg-black/60 z-20 backdrop-blur-[2px]"></div>

  <!-- CENTERED WHITE DIALOG (20px rounded) -->
  <div class="relative z-30 m-auto w-[340px] bg-white text-[#1E2340] rounded-[20px] p-5 shadow-2xl flex flex-col">
    <!-- Header -->
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-[18px] font-bold text-[#1E2340] tracking-tight">Scan Book</h2>
      <button class="text-[#8A90A6] hover:text-[#1E2340]">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- 3 Stacked Option Rows -->
    <div class="space-y-2.5">
      <!-- Row 1: Single Page -->
      <div class="p-3.5 rounded-[14px] border border-[#E5E7EB] hover:border-[#4F46E5] flex items-center space-x-3.5 bg-white cursor-pointer transition-colors group">
        <div class="w-10 h-10 rounded-xl bg-[#EEF0FF] text-[#4F46E5] flex items-center justify-center shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
        </div>
        <div class="flex-1">
          <p class="text-[13px] font-bold text-[#1E2340] group-hover:text-[#4F46E5] transition-colors">Single page</p>
          <p class="text-[11px] text-[#8A90A6]">Scan one book page at a time</p>
        </div>
        <svg class="w-4 h-4 text-[#D1D5DB]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
      </div>

      <!-- Row 2: Two pages (auto split) -->
      <div class="p-3.5 rounded-[14px] border-2 border-[#4F46E5] bg-[#EEF0FF]/30 flex items-center space-x-3.5 cursor-pointer">
        <div class="w-10 h-10 rounded-xl bg-[#4F46E5] text-white flex items-center justify-center shrink-0 shadow-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
        </div>
        <div class="flex-1">
          <p class="text-[13px] font-bold text-[#1E2340]">Two pages (auto split)</p>
          <p class="text-[11px] text-[#4F46E5] font-medium">Captures both pages and separates them</p>
        </div>
        <span class="w-2 h-2 rounded-full bg-[#4F46E5]"></span>
      </div>

      <!-- Row 3: Flatten curved page -->
      <div class="p-3.5 rounded-[14px] border border-[#E5E7EB] hover:border-[#4F46E5] flex items-center space-x-3.5 bg-white cursor-pointer transition-colors group">
        <div class="w-10 h-10 rounded-xl bg-[#EEF0FF] text-[#4F46E5] flex items-center justify-center shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
        </div>
        <div class="flex-1">
          <p class="text-[13px] font-bold text-[#1E2340] group-hover:text-[#4F46E5] transition-colors">Flatten curved page</p>
          <p class="text-[11px] text-[#8A90A6]">Removes book binding curvature with AI</p>
        </div>
        <svg class="w-4 h-4 text-[#D1D5DB]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
      </div>
    </div>
  </div>
</body>
</html>
