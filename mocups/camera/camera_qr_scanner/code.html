<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, height=844, initial-scale=1.0">
<title>docLoom - Frame 9: QR Scanner Mode</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
</style>
</head>
<body class="w-[390px] h-[844px] bg-[#0c0e14] text-white flex flex-col justify-between overflow-hidden relative select-none mx-auto">
  <!-- Top Bar -->
  <div class="relative z-10 pt-11 px-5 pb-3 flex items-center justify-between">
    <button class="w-10 h-10 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center text-white/90">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
    <div class="flex items-center space-x-3">
      <button class="w-10 h-10 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center text-white/90">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
      </button>
      <button class="w-10 h-10 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center text-white/90">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      </button>
    </div>
  </div>

  <!-- Mode Selector Row -->
  <div class="relative z-10 px-4 py-2 flex items-center justify-between text-xs font-medium tracking-wide border-b border-white/10">
    <span class="text-white/40">Document</span>
    <span class="text-white/40">ID Card</span>
    <span class="text-white/40">Book</span>
    <span class="text-white/40">Photo</span>
    <span class="text-white/40">Signature</span>
    <span class="text-[#4F46E5] font-semibold bg-indigo-500/20 px-2.5 py-1 rounded-full border border-indigo-500/30">QR Scanner</span>
    <span class="text-white/40">OCR Text</span>
  </div>

  <!-- VIEWFINDER: DIMMED EXCEPT CENTERED 240px SQUARE CUTOUT -->
  <div class="flex-1 flex flex-col items-center justify-center relative">
    <!-- Centered Cutout Frame -->
    <div class="relative w-[240px] h-[240px] flex items-center justify-center">
      <!-- 4 Indigo Corner Brackets -->
      <div class="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-[#4F46E5] rounded-tl-lg"></div>
      <div class="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-[#4F46E5] rounded-tr-lg"></div>
      <div class="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-[#4F46E5] rounded-bl-lg"></div>
      <div class="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-[#4F46E5] rounded-br-lg"></div>

      <!-- Laser scan line animation effect -->
      <div class="w-full h-0.5 bg-gradient-to-r from-transparent via-[#4F46E5] to-transparent shadow-[0_0_12px_#4F46E5]"></div>
      
      <!-- Faint QR Code Graphic inside for realism -->
      <div class="absolute inset-4 opacity-15 flex items-center justify-center">
        <svg class="w-32 h-32" fill="white" viewBox="0 0 24 24">
          <path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm13-2h3v3h-3v-3zm-5 0h2v2h-2v-2zm2 2h3v3h-3v-3zm2 2h2v2h-2v-2zm-4 2h2v2h-2v-2zm2 2h3v3h-3v-3z"/>
        </svg>
      </div>
    </div>

    <!-- Small White Caption Under Square -->
    <p class="text-white/90 text-[13px] font-medium tracking-wide mt-6 drop-shadow-md">Align QR code within the frame</p>
    <p class="text-white/40 text-[11px] mt-1">Automatic scanning enabled</p>
  </div>

  <!-- Bottom Bar: Shutter Hidden (Auto-detect), Mode Row Stays, Gallery Import Action -->
  <div class="relative z-10 pb-8 pt-4 px-6 flex items-center justify-between">
    <button class="w-11 h-11 rounded-full bg-white/10 flex items-center justify-center text-white">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
    </button>
    <!-- Hidden Shutter Placeholder to keep balance & auto indicator -->
    <div class="px-4 py-2 bg-white/10 backdrop-blur-md rounded-full text-xs font-semibold text-white/80 flex items-center space-x-2">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span>Auto Detect</span>
    </div>
    <button class="w-11 h-11 rounded-full bg-white/10 flex items-center justify-center text-white">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
    </button>
  </div>
</body>
</html>
