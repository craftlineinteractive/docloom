<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>docLoom - Navigation Drawer (Signed Out)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F4F6FA;
      color: #1E2340;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .custom-scroll::-webkit-scrollbar {
      display: none;
    }
    .custom-scroll {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="w-[390px] h-[844px] overflow-hidden relative mx-auto bg-[#F4F6FA] select-none">
  <!-- Dimmed Background Home Screen Simulation -->
  <div class="absolute inset-0 w-full h-full filter blur-[1px] opacity-70 pointer-events-none">
    <div class="h-14 bg-white flex items-center justify-between px-4 border-b border-gray-100">
      <div class="flex items-center gap-3">
        <div class="w-6 h-5 flex flex-col justify-between py-1">
          <div class="w-5 h-0.5 bg-[#1E2340]"></div>
          <div class="w-5 h-0.5 bg-[#1E2340]"></div>
          <div class="w-5 h-0.5 bg-[#1E2340]"></div>
        </div>
        <span class="font-bold text-xl text-[#1E2340]">docLoom</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="bg-amber-100 text-amber-700 text-xs px-2 py-0.5 rounded font-bold">PRO</span>
        <div class="w-5 h-5 rounded-full bg-gray-200"></div>
        <div class="w-5 h-5 rounded-full bg-gray-200"></div>
      </div>
    </div>
    <div class="p-4">
      <div class="bg-white h-11 rounded-xl border border-gray-200 px-4 flex items-center text-sm text-gray-400">Search scanned docs...</div>
    </div>
    <div class="px-4">
      <div class="text-sm font-semibold mb-3 text-gray-500">Folders (3)</div>
      <div class="grid grid-cols-3 gap-2.5">
        <div class="bg-white p-3 rounded-2xl h-24 border border-gray-100"></div>
        <div class="bg-white p-3 rounded-2xl h-24 border border-gray-100"></div>
        <div class="bg-white p-3 rounded-2xl h-24 border border-gray-100"></div>
      </div>
    </div>
  </div>

  <!-- Dark 40% Backdrop Overlay -->
  <div class="absolute inset-0 bg-black/40 backdrop-blur-[0.5px] z-10"></div>

  <!-- NAVIGATION DRAWER -->
  <aside class="absolute left-0 top-0 bottom-0 w-[312px] bg-white z-20 rounded-r-[24px] shadow-2xl flex flex-col overflow-hidden">
    
    <!-- SECTION 1: ACCOUNT HEADER (SIGNED OUT STATE) -->
    <!-- Soft indigo-tinted background #EEF0FF, rounded bottom corners, no backup size -->
    <div class="bg-[#EEF0FF] rounded-b-[20px] pt-6 pb-5 px-5 shrink-0 border-b border-indigo-100/60 shadow-[0_2px_8px_rgba(79,70,229,0.04)]">
      <div class="flex items-center gap-3.5 mb-3.5">
        <!-- Generic Account Icon (in soft circle) -->
        <div class="w-12 h-12 rounded-full bg-white flex items-center justify-center shrink-0 shadow-sm border border-indigo-100 text-[#4F46E5]">
          <svg class="w-6 h-6 text-[#4F46E5]" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
          </svg>
        </div>
        
        <!-- Text details -->
        <div class="flex-1 min-w-0">
          <h2 class="font-semibold text-[16px] text-[#1E2340] leading-tight">Back up your documents</h2>
          <p class="text-[12px] text-[#8A90A6] mt-0.5 leading-tight">Sign in to sync with Google Drive</p>
        </div>
      </div>

      <!-- Full-width indigo (#4F46E5) button "Sign in with Google" -->
      <button class="w-full h-11 bg-[#4F46E5] active:bg-[#4338CA] text-white rounded-xl font-medium text-[13.5px] flex items-center justify-center gap-2.5 shadow-md shadow-indigo-500/25 transition-all">
        <!-- Google G logo -->
        <svg class="w-4 h-4 shrink-0 bg-white rounded-full p-0.5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3h3.86c2.26-2.09 3.68-5.17 3.68-9.1z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.27v3.09C3.26 21.3 7.37 24 12 24z"/>
          <path fill="#FBBC05" d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62H1.27C.46 8.24 0 10.06 0 12s.46 3.76 1.27 5.38l4-3.09z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.37 0 3.26 2.7 1.27 6.62l4 3.09c.95-2.85 3.6-4.96 6.73-4.96z"/>
        </svg>
        <span>Sign in with Google</span>
      </button>
    </div>

    <!-- DRAWER SCROLLABLE BODY -->
    <div class="flex-1 overflow-y-auto custom-scroll px-5 py-4 space-y-4">
      
      <!-- SECTION 2: PREMIUM BANNER -->
      <div class="bg-[#FFF6DD] border border-[#F5B301]/40 rounded-[16px] p-3.5 flex items-center gap-3.5 shadow-sm active:scale-[0.99] transition-transform cursor-pointer">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#F5B301]/25 to-[#F5B301]/10 flex items-center justify-center shrink-0 border border-[#F5B301]/30">
          <svg class="w-5 h-5 text-[#D99B00]" viewBox="0 0 24 24" fill="currentColor">
            <path d="M5 16L3 5L8.5 10L12 4L15.5 10L21 5L19 16H5ZM19 19C19 19.5523 18.5523 20 18 20H6C5.44772 20 5 19.5523 5 19V17H19V19Z"/>
          </svg>
        </div>
        <div class="flex-1 min-w-0">
          <div class="font-semibold text-[14px] text-[#1E2340] leading-tight">Upgrade to Premium</div>
          <div class="text-[11.5px] text-[#8A90A6] mt-0.5 leading-tight">Unlock all features, no ads</div>
        </div>
        <svg class="w-4 h-4 text-[#8A90A6] shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
        </svg>
      </div>

      <!-- SECTION 3: MENU GROUPS (GENERAL expanded, others collapsed) -->
      <div class="space-y-3.5 pb-6">

        <!-- 1. GENERAL (EXPANDED) -->
        <div class="space-y-1">
          <div class="flex items-center justify-between py-1 px-1">
            <span class="text-[11px] font-bold tracking-wider text-[#8A90A6] uppercase">GENERAL</span>
            <svg class="w-4 h-4 text-[#8A90A6]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/>
            </svg>
          </div>

          <div class="h-[52px] flex items-center gap-3.5 px-1.5 rounded-xl hover:bg-slate-50 transition-colors cursor-pointer">
            <div class="w-9 h-9 rounded-full bg-rose-50 flex items-center justify-center shrink-0">
              <svg class="w-[18px] h-[18px] text-rose-500" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
              </svg>
            </div>
            <span class="text-[14px] font-medium text-[#1E2340]">Favourites</span>
          </div>

          <div class="h-[52px] flex items-center gap-3.5 px-1.5 rounded-xl hover:bg-slate-50 transition-colors cursor-pointer">
            <div class="w-9 h-9 rounded-full bg-amber-50 flex items-center justify-center shrink-0">
              <svg class="w-[18px] h-[18px] text-amber-600" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.568 3H5.25A2.25 2.25 0 003 5.25v4.318c0 .597.237 1.17.659 1.591l9.581 9.581c.699.699 1.78.879 2.674.435a20.087 20.087 0 004.836-3.414c1.175-1.175 2.124-2.525 2.812-3.992.418-.891.222-1.961-.462-2.645L13.518 3.518A2.25 2.25 0 0011.928 3H9.568z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 6h.008v.008H6V6z" />
              </svg>
            </div>
            <span class="text-[14px] font-medium text-[#1E2340]">Manage Tags</span>
          </div>

          <div class="h-[52px] flex items-center gap-3.5 px-1.5 rounded-xl hover:bg-slate-50 transition-colors cursor-pointer">
            <div class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center shrink-0">
              <svg class="w-[18px] h-[18px] text-slate-600" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
              </svg>
            </div>
            <span class="text-[14px] font-medium text-[#1E2340]">Trash</span>
          </div>

          <div class="h-[52px] flex items-center gap-3.5 px-1.5 rounded-xl hover:bg-slate-50 transition-colors cursor-pointer">
            <div class="w-9 h-9 rounded-full bg-indigo-50 flex items-center justify-center shrink-0">
              <svg class="w-[18px] h-[18px] text-[#4F46E5]" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 010 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 010-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </div>
            <span class="text-[14px] font-medium text-[#1E2340]">Settings</span>
          </div>
        </div>

        <div class="h-px bg-slate-100 my-2"></div>

        <!-- 2. TOOLS (COLLAPSED) -->
        <div class="space-y-1">
          <div class="flex items-center justify-between py-1.5 px-1 cursor-pointer">
            <span class="text-[11px] font-bold tracking-wider text-[#8A90A6] uppercase">TOOLS</span>
            <svg class="w-4 h-4 text-[#8A90A6]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
            </svg>
          </div>
        </div>

        <div class="h-px bg-slate-100 my-2"></div>

        <!-- 3. OTHER (COLLAPSED) -->
        <div class="space-y-1">
          <div class="flex items-center justify-between py-1.5 px-1 cursor-pointer">
            <span class="text-[11px] font-bold tracking-wider text-[#8A90A6] uppercase">OTHER</span>
            <svg class="w-4 h-4 text-[#8A90A6]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
            </svg>
          </div>
        </div>

        <div class="h-px bg-slate-100 my-2"></div>

        <!-- 4. ABOUT US (SINGLE ROW) -->
        <div class="h-[52px] flex items-center gap-3.5 px-1.5 rounded-xl hover:bg-slate-50 transition-colors cursor-pointer">
          <div class="w-9 h-9 rounded-full bg-blue-50 flex items-center justify-center shrink-0">
            <svg class="w-[18px] h-[18px] text-blue-600" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" />
            </svg>
          </div>
          <span class="text-[14px] font-medium text-[#1E2340]">About Us</span>
        </div>

        <div class="h-px bg-slate-100 my-2"></div>

        <!-- 5. MORE (COLLAPSED) -->
        <div class="space-y-1">
          <div class="flex items-center justify-between py-1.5 px-1 cursor-pointer">
            <span class="text-[11px] font-bold tracking-wider text-[#8A90A6] uppercase">MORE</span>
            <svg class="w-4 h-4 text-[#8A90A6]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
            </svg>
          </div>
        </div>

      </div>

    </div>

    <!-- Minimal Drawer Footer note -->
    <div class="px-5 py-3 border-t border-slate-100 flex items-center justify-between text-[11px] text-[#8A90A6] bg-slate-50/50">
      <span>docLoom v2.4.1</span>
      <span>Build 2026.09</span>
    </div>

  </aside>
</body>
</html>
