<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>docLoom - Adjust & Crop (Default)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0F1220;
      color: #FFFFFF;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen bg-[#070913]">

  <!-- Mobile Screen Container 390x844 -->
  <div class="w-[390px] h-[844px] bg-[#0F1220] flex flex-col relative overflow-hidden select-none shadow-2xl">

    <!-- Top App Bar (56px) -->
    <div class="h-14 px-4 flex items-center justify-between z-20 shrink-0">
      <button class="w-10 h-10 flex items-center justify-center text-white/90 active:scale-95 transition-transform" aria-label="Back">
        <svg class="w-6 h-6 stroke-[1.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/>
        </svg>
      </button>
      <h1 class="text-[17px] font-semibold text-white tracking-tight">Adjust</h1>
      <div class="w-10 h-10 flex items-center justify-end">
        <span class="text-xs font-medium text-white/70 bg-white/10 px-2 py-0.5 rounded-full">1/1</span>
      </div>
    </div>

    <!-- Image Area with Crop Quad -->
    <div class="flex-1 px-4 flex flex-col justify-center items-center relative overflow-hidden">
      <!-- Document Canvas / Desk Area -->
      <div class="w-full h-[360px] bg-[#171B2F] rounded-2xl relative overflow-hidden border border-white/5 shadow-inner flex items-center justify-center">
        <!-- Desk Texture / Simulated background document -->
        <div class="absolute inset-0 bg-gradient-to-br from-[#1A1F36] to-[#121526]"></div>

        <!-- The Paper Document itself slightly tilted -->
        <div class="absolute w-[240px] h-[300px] bg-[#F8F9FA] rounded-[3px] shadow-2xl rotate-[-2deg] p-4 flex flex-col justify-between overflow-hidden">
          <!-- Document simulation lines and header -->
          <div class="space-y-2 opacity-80">
            <div class="flex items-center justify-between pb-1 border-b border-neutral-300">
              <div class="w-16 h-2 bg-neutral-800 rounded-sm"></div>
              <div class="w-8 h-1.5 bg-neutral-400 rounded-sm"></div>
            </div>
            <div class="w-full h-1.5 bg-neutral-300 rounded-sm"></div>
            <div class="w-4/5 h-1.5 bg-neutral-300 rounded-sm"></div>
            <div class="w-full h-1.5 bg-neutral-300 rounded-sm"></div>
            <div class="w-2/3 h-1.5 bg-neutral-300 rounded-sm"></div>
          </div>
          <div class="space-y-1.5 opacity-60">
            <div class="w-full h-1 bg-neutral-300 rounded-sm"></div>
            <div class="w-5/6 h-1 bg-neutral-300 rounded-sm"></div>
            <div class="w-full h-1 bg-neutral-300 rounded-sm"></div>
          </div>
          <div class="flex justify-between items-end pt-2 border-t border-neutral-200">
            <div class="w-16 h-3 border border-neutral-400 rounded-sm"></div>
            <div class="w-12 h-2 bg-neutral-400 rounded-sm"></div>
          </div>
        </div>

        <!-- Dimmed Overlay Outside Crop Polygon via SVG with mask -->
        <svg class="absolute inset-0 w-full h-full pointer-events-none z-10" viewBox="0 0 358 360">
          <defs>
            <mask id="cropMask1">
              <rect width="100%" height="100%" fill="white" />
              <!-- Cutout for quad: Tilted matching paper ~ (64, 34) (300, 24) (288, 326) (50, 334) -->
              <polygon points="62,34 298,24 286,326 50,334" fill="black" />
            </mask>
          </defs>
          <!-- 50% Dim outer area -->
          <rect width="100%" height="100%" fill="rgba(15, 18, 32, 0.55)" mask="url(#cropMask1)" />

          <!-- Quadrilateral Stroke (2px #6366F1) -->
          <polygon points="62,34 298,24 286,326 50,334" fill="none" stroke="#6366F1" stroke-width="2" />

          <!-- Edge Midpoint Pill Handles -->
          <!-- Top edge midpoint: (180, 29) -->
          <rect x="173" y="25" width="14" height="8" rx="4" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5" />
          <!-- Right edge midpoint: (292, 175) -->
          <rect x="288" y="168" width="8" height="14" rx="4" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5" />
          <!-- Bottom edge midpoint: (168, 330) -->
          <rect x="161" y="326" width="14" height="8" rx="4" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5" />
          <!-- Left edge midpoint: (56, 184) -->
          <rect x="52" y="177" width="8" height="14" rx="4" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5" />

          <!-- Corner Round Handles (24px diameter, white fill, indigo stroke) -->
          <!-- Top-Left (62, 34) -->
          <circle cx="62" cy="34" r="12" fill="#FFFFFF" stroke="#6366F1" stroke-width="2.5" />
          <circle cx="62" cy="34" r="4" fill="#6366F1" />

          <!-- Top-Right (298, 24) -->
          <circle cx="298" cy="24" r="12" fill="#FFFFFF" stroke="#6366F1" stroke-width="2.5" />
          <circle cx="298" cy="24" r="4" fill="#6366F1" />

          <!-- Bottom-Right (286, 326) -->
          <circle cx="286" cy="326" r="12" fill="#FFFFFF" stroke="#6366F1" stroke-width="2.5" />
          <circle cx="286" cy="326" r="4" fill="#6366F1" />

          <!-- Bottom-Left (50, 334) -->
          <circle cx="50" cy="334" r="12" fill="#FFFFFF" stroke="#6366F1" stroke-width="2.5" />
          <circle cx="50" cy="334" r="4" fill="#6366F1" />
        </svg>
      </div>

      <!-- Hint row below image -->
      <div class="flex items-center gap-1.5 mt-2.5 mb-1 px-1">
        <svg class="w-3.5 h-3.5 text-[#8A90A6] shrink-0 stroke-[1.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9"/>
          <path stroke-linecap="round" d="M12 8v4m0 4h.01"/>
        </svg>
        <span class="text-xs text-[#8A90A6]">Drag the points to adjust the borders.</span>
      </div>
    </div>

    <!-- Controls Section -->
    <div class="px-4 pb-4 space-y-3 shrink-0">
      
      <!-- Filter Row -->
      <div class="flex items-center justify-between pt-1">
        <span class="text-[11px] font-semibold text-[#8A90A6] uppercase tracking-wider">FILTER</span>
        <button class="flex items-center gap-2 px-3 py-1.5 rounded-xl border border-white/30 bg-white/5 active:bg-white/10 transition-colors">
          <span class="text-xs font-medium text-white">Vivid Light</span>
          <svg class="w-3.5 h-3.5 text-white/80 stroke-[1.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/>
          </svg>
        </button>
      </div>

      <!-- Tool Row (Rotate, Crop, Doc Name) -->
      <div class="grid grid-cols-3 gap-2 py-1.5 border-y border-white/10">
        <!-- Rotate -->
        <button class="flex flex-col items-center justify-center gap-1 py-1 text-white hover:text-white/80 active:scale-95 transition-transform">
          <svg class="w-5 h-5 stroke-[1.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/>
          </svg>
          <span class="text-[11px] font-medium tracking-tight">Rotate</span>
        </button>

        <!-- Crop -->
        <button class="flex flex-col items-center justify-center gap-1 py-1 text-white hover:text-white/80 active:scale-95 transition-transform">
          <svg class="w-5 h-5 stroke-[1.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 3.75v13.5a1.5 1.5 0 001.5 1.5h13.5M3.75 7.5h13.5a1.5 1.5 0 011.5 1.5v13.5"/>
          </svg>
          <span class="text-[11px] font-medium tracking-tight">Crop</span>
        </button>

        <!-- Doc Name -->
        <button class="flex flex-col items-center justify-center gap-1 py-1 text-white hover:text-white/80 active:scale-95 transition-transform">
          <svg class="w-5 h-5 stroke-[1.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487zm0 0L19.5 7.125"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 21h18"/>
          </svg>
          <span class="text-[11px] font-medium tracking-tight">Doc Name</span>
        </button>
      </div>

      <!-- Auto-crop Toggle Row -->
      <div class="flex items-center justify-between py-0.5">
        <div class="flex items-center gap-2">
          <svg class="w-4 h-4 text-[#8A90A6] stroke-[1.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 010 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.6 6.6 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.241.437-.613.43-.991a6.932 6.932 0 010-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          <span class="text-xs text-[#8A90A6]">Show crop screen after every capture</span>
        </div>
        <!-- Active Toggle Switch -->
        <div class="w-10 h-6 bg-[#4F46E5] rounded-full flex items-center justify-end px-0.5 cursor-pointer">
          <div class="w-5 h-5 bg-white rounded-full shadow-md"></div>
        </div>
      </div>

      <!-- Bottom Action Bar (Retake / Continue) -->
      <div class="flex items-center gap-3 pt-1">
        <button class="flex-1 h-[52px] rounded-[14px] border border-white/30 text-white font-semibold text-sm active:bg-white/10 transition-colors flex items-center justify-center">
          Retake
        </button>
        <button class="flex-1 h-[52px] rounded-[14px] bg-[#4F46E5] hover:bg-[#4338CA] text-white font-semibold text-sm shadow-lg shadow-indigo-600/30 active:scale-[0.98] transition-transform flex items-center justify-center">
          Continue
        </button>
      </div>

    </div>

  </div>

</body>
</html>
